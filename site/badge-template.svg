<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenTakeoff Academy — embeddable "OpenTakeoff Certified" badge TEMPLATE.

  This file is a self-contained, shields-style badge you can hand-edit, but the
  preferred way to make a real badge is the generator in ./badge.js, which sizes
  the segments for you and emits the Certified vs Self-Reported variants:

      OTABadge.svg({ competency: 'area-takeoff',
                     tier: 'journeyman',
                     attestation: 'certified' })   ->  "<svg …>"

  Per-cert badges are pre-rendered from that same source to
  ./certs/<CERT_ID>.badge.svg (what the README / model-card / LinkedIn snippets
  point at).

  To hand-edit THIS template:
    • MESSAGE ...... replace "Competency · Tier" (two <text> nodes) with e.g.
                     "Area Takeoff · Journeyman".
    • ACCENT ....... the right-segment colour <rect fill="#1f9dd6"> and the
                     <clipPath>/shadow widths. Tier accents:
                       apprentice #ff7a1a · journeyman #1f9dd6 · master #f2b100
    • WIDTH ........ if you change the text, update width/viewBox and the segment
                     x/width so the message stays centred. (badge.js does this
                     automatically — recommended.)

  Self-Reported variant (visibly distinct, lower trust): dark-slate right
  segment (#57503f) overlaid with a 45° hazard-stripe <pattern> and a dashed
  outline, label reads "OpenTakeoff · Self-Reported", and the corner check mark
  is dropped. See badge.js for the exact output.

  This template shows the CERTIFIED variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="307" height="20" viewBox="0 0 307 20" role="img" aria-label="OpenTakeoff Certified — Competency · Tier"><title>OpenTakeoff Certified — Competency · Tier</title><defs><linearGradient id="ota-sh" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".9" stop-color="#000" stop-opacity=".12"/></linearGradient><pattern id="ota-str" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#1f9dd6"/><rect width="3.2" height="7" fill="#3f3a2d"/></pattern><clipPath id="ota-r"><rect width="307" height="20" rx="3"/></clipPath></defs><g clip-path="url(#ota-r)"><rect width="167" height="20" fill="#191510"/><rect x="167" width="140" height="20" fill="#1f9dd6"/><rect width="307" height="20" fill="url(#ota-sh)"/></g><g transform="translate(4,4.5)" fill="#ffe05a"><path d="M0.5 9 H10.5 V10.2 H0.5 Z"/><path d="M5.5 1.4 C2.9 1.4 1.4 3.4 1.4 6 V7.4 H9.6 V6 C9.6 3.4 8.1 1.4 5.5 1.4 Z"/><rect x="4.7" y="0.2" width="1.6" height="1.8" rx="0.4"/></g><g transform="translate(293,0)"><circle cx="6.5" cy="10" r="6" fill="rgba(255,255,255,0.9)"/><path d="M3.6 10.2 L5.6 12.2 L9.4 7.6" fill="none" stroke="#1e7a45" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11" font-weight="bold"><text x="91.0" y="14.5" fill="#000" fill-opacity="0.35" textLength="130" lengthAdjust="spacingAndGlyphs">OpenTakeoff Certified</text><text x="91.0" y="13.5" fill="#ffe05a" textLength="130" lengthAdjust="spacingAndGlyphs">OpenTakeoff Certified</text><text x="229.5" y="14.5" fill="#000" fill-opacity="0.3" textLength="103" lengthAdjust="spacingAndGlyphs">Competency · Tier</text><text x="229.5" y="13.5" fill="#ffffff" textLength="103" lengthAdjust="spacingAndGlyphs">Competency · Tier</text></g></svg>

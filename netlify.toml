# netlify.toml — OpenTakeoff Academy static site (aec.kentucky-ai.com).
#
# Plain HTML/CSS/JS, no build step: Netlify just publishes the `site/` dir.
#
# Netlify Forms: the Request-Certification form is declared statically in
# site/request-certification.html (a <form name="request-certification"
# data-netlify="true" netlify-honeypot="bot-field"> with the hidden form-name
# input + bot-field honeypot). New Netlify sites ship with form detection OFF,
# so the form only registers after detection is enabled AND the site is
# redeployed — see DEPLOY.md for the exact enable/redeploy steps.

[build]
  publish = "site"

# Pretty, shareable cert URLs: /cert/OTA-D9A-0047 → /cert.html?id=OTA-D9A-0047
# status = 200 is a rewrite (proxy): the address bar keeps /cert/:id while
# cert.html reads the id from its ?id= query param.
[[redirects]]
  from = "/cert/:id"
  to = "/cert.html?id=:id"
  status = 200

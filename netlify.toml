# netlify.toml — OpenTakeoff Academy static site (aec.kentucky-ai.com).
#
# Plain HTML/CSS/JS, no build step: Netlify just publishes the `site/` dir.
#
# Netlify Forms: two static forms are declared with data-netlify="true" +
# netlify-honeypot="bot-field" and a hidden form-name input —
#   - request-certification  (site/request-certification.html)
#   - contribute-plan        (site/contribute-plan.html; multipart, accepts an upload)
# New Netlify sites ship with form detection OFF, so a form only registers after
# detection is enabled AND the site is redeployed — see DEPLOY.md.

[build]
  publish = "site"

# Pretty, shareable cert URLs: /cert/OTA-D9A-0047 → /cert.html?id=OTA-D9A-0047
# status = 200 is a rewrite (proxy): the address bar keeps /cert/:id while
# cert.html reads the id from its ?id= query param.
[[redirects]]
  from = "/cert/:id"
  to = "/cert.html?id=:id"
  status = 200

# The schemas + protocol are the repo's source of truth (not duplicated into
# site/). Proxy same-domain paths to the canonical raw files so machine-readable
# links (llms.txt, for-agents.html) and the existing how-to-enter/request-cert
# references resolve at aec.kentucky-ai.com. NOTE: needs the repo public — true by
# launch time (DEPLOY §1 flips it public before the site deploys).
[[redirects]]
  from = "/schema/*"
  to = "https://raw.githubusercontent.com/Kentucky-ai/opentakeoff-academy/main/schema/:splat"
  status = 200
[[redirects]]
  from = "/PROTOCOL.md"
  to = "https://raw.githubusercontent.com/Kentucky-ai/opentakeoff-academy/main/PROTOCOL.md"
  status = 200
